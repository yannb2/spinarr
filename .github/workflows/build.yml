name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Bump script tests
        run: python3 -I -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Test
        run: dotnet test --configuration Release

  # Builds the image on every pull request so a broken Dockerfile shows up there;
  # pushes it only from main (tag dev) and from v* tags (version and latest).
  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      # The page looks fine without blazor.web.js but nothing on it works,
      # so check the image really serves it before pushing.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: spinarr:smoke
          cache-from: type=gha

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8187:8187 spinarr:smoke
          for i in $(seq 1 30); do curl -fs http://localhost:8187/health && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:8187/_framework/blazor.web.js
          curl -fsS http://localhost:8187/ | grep -q "Spinarr"
          curl -fsS http://localhost:8187/api/stats | grep -q '"drives"'
          # Every tool runs and reports the version the Dockerfile pinned.
          docker exec smoke sh -c 'whipper -v | grep "yannb2.g$(echo $SPINARR_PIN_WHIPPER | cut -c1-7)"'
          # cd-paranoia prints "cdparanoia III release 10.2 libcdio 2.1.0": the part of its pin before the +.
          docker exec smoke sh -c 'cd-paranoia --version 2>&1 | grep -F "release ${SPINARR_PIN_CD_PARANOIA%%+*} libcdio $SPINARR_PIN_LIBCDIO"'
          docker exec smoke sh -c 'grep -x "Version: $SPINARR_PIN_LIBCDIO" /usr/lib/pkgconfig/libcdio.pc'
          docker exec smoke sh -c 'cdrdao 2>&1 | head -n 1'
          docker exec smoke sh -c 'flac --version && metaflac --version && sox --version'
          docker exec smoke sh -c 'python3 -c "import cdio, discid, accuraterip, musicbrainzngs, mutagen; print(\"python modules ok\")"'
          # whipper's own commands load. Not "offset find --help": a command that takes -d looks for a
          # drive first and stops with "No CD-DA drives found!", and CI has none.
          docker exec smoke sh -c 'whipper offset --help | grep -q find && whipper drive --help | grep -q analyze'
          docker logs smoke
          docker rm -f smoke

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
